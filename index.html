<!doctype html>
<html lang="pt-BR" data-theme="dark" class="is-booting">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Relógio e calendário circular com anéis concêntricos, sempre no horário de São Paulo — Brasil (America/Sao_Paulo).">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0a0b0d">
  <title>Modern Circular Clock — São Paulo</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/clock.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <svg class="brand__mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".35"/>
          <circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".6"/>
          <circle cx="12" cy="12" r="1.8" fill="currentColor"/>
        </svg>
        <span class="brand__name">Modern Circular Clock</span>
      </div>

      <p class="zone-chip">
        <span class="zone-chip__dot" aria-hidden="true"></span>
        <span>São Paulo — Brasil</span>
      </p>
    </header>

    <main class="stage" id="main">
      <figure class="clock" id="clock">
        <svg class="clock__dial" id="clock-dial" viewBox="0 0 1000 1000">
          <defs>
            <radialGradient id="face-gradient" cx="50%" cy="38%" r="65%">
              <stop class="face-stop--hi" offset="0%"/>
              <stop class="face-stop--lo" offset="100%"/>
            </radialGradient>
          </defs>
          <circle class="clock__bezel" cx="500" cy="500" r="496"/>
          <path class="clock__marker" d="M491 7 h18 l-9 11 z"/>
          <g class="clock__rings" id="clock-rings"></g>
          <circle class="clock__face" cx="500" cy="500" r="238"/>
          <g class="clock__face-details" id="clock-face-details" aria-hidden="true"></g>
        </svg>

        <svg class="clock__hands" id="clock-hands" viewBox="0 0 1000 1000" aria-hidden="true" focusable="false">
          <defs>
            <filter id="hand-shadow" x="-50%" y="-50%" width="200%" height="200%">
              <feDropShadow class="hand-shadow" dx="0" dy="5" stdDeviation="5"/>
            </filter>
          </defs>
          <g class="hands" filter="url(#hand-shadow)">
            <g class="hand hand--hour" data-hand="hour">
              <line x1="500" y1="526" x2="500" y2="370"/>
            </g>
            <g class="hand hand--minute" data-hand="minute">
              <line x1="500" y1="530" x2="500" y2="296"/>
            </g>
            <circle class="hand-cap" cx="500" cy="500" r="14"/>
            <g class="hand hand--second" data-hand="second">
              <line x1="500" y1="552" x2="500" y2="280"/>
              <circle cx="500" cy="552" r="7"/>
            </g>
            <circle class="hand-cap hand-cap--second" cx="500" cy="500" r="6"/>
          </g>
        </svg>
      </figure>

      <section class="panel panel--digital" id="digital" aria-labelledby="digital-title">
        <p class="eyebrow" id="digital-title">Horário de São Paulo</p>
        <p class="digital-time">
          <time data-digital="time" datetime=""><span data-digital="hm">--:--</span><span class="digital-time__seconds" data-digital="seconds">:--</span><span class="digital-time__period" data-digital="period" hidden></span></time>
        </p>
        <p class="digital-date">
          <span class="digital-date__day" data-digital="day">--</span>
          <span class="digital-date__month" data-digital="month">---</span>
          <span class="digital-date__year" data-digital="year">----</span>
        </p>
        <p class="digital-weekday" data-digital="weekday">&nbsp;</p>
        <p class="digital-zone">
          <span class="digital-zone__name">São Paulo — Brasil</span>
          <span class="digital-zone__id">America/Sao_Paulo · <span data-digital="offset">UTC</span></span>
        </p>
      </section>

      <section class="panel panel--progress" id="progress" aria-labelledby="progress-title">
        <p class="eyebrow" id="progress-title">Progresso</p>
        <div class="progress-body">
          <svg class="progress-rings" viewBox="0 0 200 200" aria-hidden="true" focusable="false" data-progress="rings"></svg>
          <div class="progress-legend">
          <div class="progress-row progress-row--day" data-progress-row="day" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Progresso do dia">
            <span class="progress-row__dot" aria-hidden="true"></span>
            <span class="progress-row__label">Dia</span>
            <span class="progress-row__value" data-progress-value>0,00%</span>
            <span class="progress-row__detail" data-progress-detail></span>
          </div>
          <div class="progress-row progress-row--week" data-progress-row="week" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Progresso da semana">
            <span class="progress-row__dot" aria-hidden="true"></span>
            <span class="progress-row__label">Semana</span>
            <span class="progress-row__value" data-progress-value>0,00%</span>
            <span class="progress-row__detail" data-progress-detail></span>
          </div>
          <div class="progress-row progress-row--month" data-progress-row="month" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Progresso do mês">
            <span class="progress-row__dot" aria-hidden="true"></span>
            <span class="progress-row__label">Mês</span>
            <span class="progress-row__value" data-progress-value>0,00%</span>
            <span class="progress-row__detail" data-progress-detail></span>
          </div>
          <div class="progress-row progress-row--year" data-progress-row="year" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Progresso do ano">
            <span class="progress-row__dot" aria-hidden="true"></span>
            <span class="progress-row__label">Ano</span>
            <span class="progress-row__value" data-progress-value>0,00%</span>
            <span class="progress-row__detail" data-progress-detail></span>
          </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <noscript>
    <p class="noscript">Este relógio precisa de JavaScript para calcular o horário de São Paulo.</p>
  </noscript>
</body>
</html>
